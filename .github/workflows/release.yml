name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semver:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.next }}
      bump: ${{ steps.semver.outputs.bump }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: v0.0.0
          noNewCommitBehavior: current
          noVersionBumpBehavior: current

      - name: Create and push tag
        if: steps.semver.outputs.bump != 'none'
        run: |
          git tag ${{ steps.semver.outputs.next }}
          git push origin ${{ steps.semver.outputs.next }}

  build:
    needs: semver
    if: needs.semver.outputs.bump != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set up musl kernel headers
        run: |
          for dir in asm-generic drm linux mtd rdma sound video xen; do
            sudo ln -sf /usr/include/$dir /usr/include/x86_64-linux-musl/$dir
          done

      - name: Build all static binaries
        run: |
          export PKG_CONFIG_ALLOW_CROSS=1
          export CC_x86_64_unknown_linux_musl=musl-gcc
          TARGET="x86_64-unknown-linux-musl"
          for bin in swissledger-forge swissledger-cast swissledger-anvil swissledger-chisel; do
            echo "::group::Building $bin"
            cargo build --profile dist --target "$TARGET" --features "asm-keccak cli" --bin "$bin"
            echo "::endgroup::"
          done

      - name: Upload forge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swissledger-forge
          path: target/x86_64-unknown-linux-musl/dist/swissledger-forge

      - name: Upload cast
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swissledger-cast
          path: target/x86_64-unknown-linux-musl/dist/swissledger-cast

      - name: Upload anvil
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swissledger-anvil
          path: target/x86_64-unknown-linux-musl/dist/swissledger-anvil

      - name: Upload chisel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swissledger-chisel
          path: target/x86_64-unknown-linux-musl/dist/swissledger-chisel

  release:
    needs: [semver, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: swissledger-*
          merge-multiple: false
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.semver.outputs.version }}
          name: ${{ needs.semver.outputs.version }}
          generate_release_notes: true
          files: artifacts/*/swissledger-*
