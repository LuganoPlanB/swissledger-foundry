name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semver:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.next }}
      bump: ${{ steps.semver.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: v0.0.0
          noNewCommitBehavior: current
          noVersionBumpBehavior: current

      - name: Create and push tag
        if: steps.semver.outputs.bump != 'none'
        run: |
          git tag ${{ steps.semver.outputs.next }}
          git push origin ${{ steps.semver.outputs.next }}

  build:
    needs: semver
    if: needs.semver.outputs.bump != 'none'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: [swissledger-forge, swissledger-cast, swissledger-anvil, swissledger-chisel]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set up musl kernel headers
        run: |
          for dir in asm-generic drm linux mtd rdma sound video xen; do
            sudo ln -sf /usr/include/$dir /usr/include/x86_64-linux-musl/$dir
          done

      - name: Build static binary (${{ matrix.binary }})
        run: |
          PKG_CONFIG_ALLOW_CROSS=1 \
          CC_x86_64_unknown_linux_musl=musl-gcc \
          cargo build \
            --locked \
            --profile dist \
            --target x86_64-unknown-linux-musl \
            --features "asm-keccak cli" \
            --bin ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: target/x86_64-unknown-linux-musl/dist/${{ matrix.binary }}

  release:
    needs: [semver, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: swissledger-*
          merge-multiple: false
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.semver.outputs.version }}
          name: ${{ needs.semver.outputs.version }}
          generate_release_notes: true
          files: artifacts/*/swissledger-*
