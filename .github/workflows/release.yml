name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semver:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.next }}
      bump: ${{ steps.semver.outputs.bump }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: v0.0.0
          patchAll: true
          noNewCommitBehavior: current
          noVersionBumpBehavior: current

      - name: Create and push tag
        if: steps.semver.outputs.bump != 'none'
        run: |
          git tag ${{ steps.semver.outputs.next }}
          git push origin ${{ steps.semver.outputs.next }}

  build:
    needs: semver
    if: needs.semver.outputs.bump != 'none'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: linux-x86_64
            features: "asm-keccak cli"
            setup_musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            features: "cli"
            setup_musl: false
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: darwin-x86_64
            features: "cli"
            setup_musl: false
    env:
      TAG_NAME: ${{ needs.semver.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up musl
        if: matrix.setup_musl
        id: musl
        uses: dyne/musl-action@main
        with:
          target_arch: x86_64

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}/dist
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build all binaries
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: |
          if [ "${{ matrix.setup_musl }}" = "true" ]; then
            export PKG_CONFIG_ALLOW_CROSS=1
            export CC_x86_64_unknown_linux_musl="${{ steps.musl.outputs.CC }}"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            export CARGO_PROFILE_DIST_LTO=thin
          fi
          cargo build \
            --profile dist \
            --target "$TARGET" \
            --features "$FEATURES" \
            --locked \
            --bin swissledger-forge \
            --bin swissledger-cast \
            --bin swissledger-anvil \
            --bin swissledger-chisel

      - name: Rename and stage binaries
        run: |
          mkdir -p staged
          SUFFIX="${{ matrix.suffix }}"
          for bin in swissledger-forge swissledger-cast swissledger-anvil swissledger-chisel; do
            cp "target/${{ matrix.target }}/dist/$bin" "staged/${bin}_${SUFFIX}"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swissledger-binaries_${{ matrix.suffix }}
          path: staged/*

  release:
    needs: [semver, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: swissledger-binaries_*
          merge-multiple: false
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.semver.outputs.version }}
          name: ${{ needs.semver.outputs.version }}
          generate_release_notes: true
          files: artifacts/*/swissledger-*
