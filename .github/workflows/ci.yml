name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/build

      - name: Smoke test (on-chain)
        if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.pull_request.labels.*.name, 'skip-smoke') }}
        env:
          RPC_URL: ${{ vars.SWISSLEDGER_TESTNET_RPC }}
          PRIVATE_KEY: ${{ secrets.SWISSLEDGER_TESTNET_DEPLOY }}
          CHAIN_ID: 222
        run: |
          set -euo pipefail

          FORGE=./target/debug/swissledger-forge
          CAST=./target/debug/swissledger-cast

          if [ -z "${RPC_URL:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║  WARNING: on-chain smoke test SKIPPED                       ║"
            echo "║  RPC_URL or PRIVATE_KEY not available.                      ║"
            echo "║  No chain compatibility validation was performed.           ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
            exit 0
          fi

          echo "=== A. Connectivity ==="

          echo -n "block-number: "
          $CAST block-number --rpc-url "$RPC_URL"

          echo -n "chain-id:     "
          CHAIN=$($CAST chain-id --rpc-url "$RPC_URL")
          echo "$CHAIN"
          if [ "$CHAIN" != "$CHAIN_ID" ]; then
            echo "FAIL: expected chain $CHAIN_ID, got $CHAIN"
            exit 1
          fi
          echo "  PASS: chain-id matches"

          ADDR=$($CAST wallet address --private-key "$PRIVATE_KEY")
          echo -n "balance:      "
          $CAST balance --rpc-url "$RPC_URL" "$ADDR" || echo "0 (ok)"

          echo ""
          echo "=== B. Minimal transaction ==="

          echo "sending zero-value transfer to self..."
          $CAST send "$ADDR" --value 0 \
            --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" \
            --legacy --gas-price 0 --chain "$CHAIN_ID" \
            --gas-limit 21000 \
            > /dev/null
          echo "  PASS: tx confirmed"

          echo ""
          echo "=== C. Deploy + interact ==="

          echo "deploying Counter..."
          DEPLOY=$($FORGE create .github/smoke/Counter.sol:Counter \
            --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" \
            --legacy --gas-price 0 --chain "$CHAIN_ID" \
            --gas-limit 200000 \
            --broadcast --json)
          COUNTER=$(echo "$DEPLOY" | jq -r .deployedTo)
          echo "  deployed: $COUNTER"

          echo -n "count() == 0? "
          VAL=$($CAST call "$COUNTER" "count()(uint256)" --rpc-url "$RPC_URL")
          if [ "$VAL" != "0" ]; then
            echo "FAIL: expected 0, got $VAL"
            exit 1
          fi
          echo "  PASS"

          echo "calling increment()..."
          $CAST send "$COUNTER" "increment()" \
            --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" \
            --legacy --gas-price 0 --chain "$CHAIN_ID" \
            --gas-limit 100000 \
            > /dev/null
          echo "  TX confirmed"

          echo -n "count() == 1? "
          VAL=$($CAST call "$COUNTER" "count()(uint256)" --rpc-url "$RPC_URL")
          if [ "$VAL" != "1" ]; then
            echo "FAIL: expected 1, got $VAL"
            exit 1
          fi
          echo "  PASS"

          echo ""
          echo "=== PASS: on-chain smoke test ==="
