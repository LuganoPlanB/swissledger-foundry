name: Build swissledger-foundry
description: Optimized Rust workspace build with sccache, mold linker, and smart caching

inputs:
  features:
    description: Cargo features to enable (comma-separated)
    default: ''
  profile:
    description: Build profile (dev, release, dist, profiling)
    default: dev
  args:
    description: Additional cargo build arguments
    default: ''

runs:
  using: composite
  steps:
    - name: Install mold linker (Linux)
      if: runner.os == 'Linux'
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      with:
        mold-version: latest

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    - name: Install Rust toolchain (stable)
      uses: dtolnay/rust-toolchain@stable

    - name: Restore cargo caches
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build workspace
      shell: bash
      run: |
        PROFILE_FLAG=""
        FEATURES_FLAG=""
        if [ -n "${{ inputs.profile }}" ] && [ "${{ inputs.profile }}" != "dev" ]; then
          PROFILE_FLAG="--profile ${{ inputs.profile }}"
        fi
        if [ -n "${{ inputs.features }}" ]; then
          FEATURES_FLAG="--features ${{ inputs.features }}"
        fi

        cargo build \
          --workspace \
          --locked \
          $PROFILE_FLAG \
          $FEATURES_FLAG \
          ${{ inputs.args }}
      env:
        SCCACHE_GHA_ENABLED: 'true'
        RUSTC_WRAPPER: sccache
        CARGO_INCREMENTAL: 1

    - name: Save cargo caches
      if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
