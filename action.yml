name: Setup swissledger-foundry
description: Install swissledger-foundry binaries (forge, cast, anvil, chisel) from GitHub releases

inputs:
  version:
    description: Release version tag, or "latest" (default) for the most recent release
    default: latest
  token:
    description: GitHub token for release downloads
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install swissledger-foundry
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # Map runner to release asset suffix
        case "$RUNNER_OS" in
          Linux)   os=linux ;;
          macOS)   os=darwin ;;
          *)       echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=x86_64 ;;
          ARM64) arch=arm64 ;;
          *)     echo "unsupported runner arch: $RUNNER_ARCH"; exit 1 ;;
        esac
        suffix="${os}-${arch}"

        bindir="$HOME/.local/bin"
        mkdir -p "$bindir"

        for tool in forge cast anvil chisel; do
          pattern="swissledger-${tool}_${suffix}"
          echo "downloading $pattern"
          gh release download "$VERSION" \
            --repo LuganoPlanB/swissledger-foundry \
            --pattern "$pattern" \
            --dir "$bindir" \
            --clobber
          mv "$bindir/$pattern" "$bindir/swissledger-$tool"
          chmod +x "$bindir/swissledger-$tool"
        done

        echo "$bindir" >> "$GITHUB_PATH"
