[package]
name = "tempo-contracts"
version = "1.6.0"
edition = "2024"
rust-version = "1.93"
description = "Tempo contracts stub (SwissLedger fork)"

[lib]
path = "src/lib.rs"

[dependencies]
alloy-contract.workspace = true
alloy-primitives = { version = "1.5.2", features = ["serde"] }
alloy-sol-types = "1.5.2"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = ["std", "serde"]
rpc = []
serde = ["dep:serde"]
std = []
